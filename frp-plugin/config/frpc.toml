# FRP 客户端配置示例
# 使用邮箱作为用户名，用户 ID 作为 token

serverAddr = "127.0.0.1"
serverPort = 7000

# 用户名使用注册的邮箱
user = "test@example.com"

# token 使用用户 ID (可在后端数据库或个人信息页面查看)
[metadatas]
token = "2"

# TCP 隧道示例
[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000

# HTTP 隧道示例
[[proxies]]
name = "web"
type = "http"
localIP = "127.0.0.1"
localPort = 8080
customDomains = ["test.example.com"]
