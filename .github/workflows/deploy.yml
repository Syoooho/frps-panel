name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          # 创建生产环境配置
          echo "VITE_USE_MOCK=false" > .env.production
          echo "VITE_API_BASE_URL=/api/v1" >> .env.production
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build FRP Plugin
        run: |
          cd frp-plugin
          go mod download
          # 静态编译，不依赖系统 glibc
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o frps-panel-linux-amd64 ./cmd/frps-panel

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp -r frontend/dist deploy/frontend
          cp -r backend deploy/backend
          cp -r scripts deploy/
          cp frp-plugin/frps-panel-linux-amd64 deploy/
          cp frp-plugin/config/*.toml deploy/
          
      - name: Create backend .env file
        run: |
          cat > deploy/backend/.env << EOF
          DATABASE_URL=sqlite:///./frps_panel.db
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          FRP_SERVER_ADDR=${{ secrets.FRP_SERVER_ADDR }}
          FRP_SERVER_PORT=7000
          EOF
          
      - name: Create deployment script
        run: |
          cat > deploy/deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          APP_DIR="/opt/frps-panel"
          BACKUP_DIR="/opt/frps-panel-backup-$(date +%Y%m%d-%H%M%S)"
          
          echo "🚀 开始部署..."
          
          # 备份现有部署
          if [ -d "$APP_DIR" ]; then
            echo "📦 备份现有部署到 $BACKUP_DIR"
            cp -r $APP_DIR $BACKUP_DIR
          fi
          
          # 创建应用目录
          mkdir -p $APP_DIR
          
          # 停止服务
          echo "⏸️  停止现有服务..."
          systemctl stop frps || true
          systemctl stop frps-panel-backend || true
          systemctl stop frps-panel-plugin || true
          systemctl stop nginx || true
          
          # 备份数据库
          if [ -f "$APP_DIR/backend/frps_panel.db" ]; then
            echo "💾 备份数据库..."
            cp $APP_DIR/backend/frps_panel.db /tmp/frps_panel.db.backup
          fi
          
          # 部署前端
          echo "📱 部署前端..."
          rm -rf $APP_DIR/frontend
          cp -r frontend $APP_DIR/
          
          # 部署后端
          echo "🔧 部署后端..."
          rm -rf $APP_DIR/backend
          cp -r backend $APP_DIR/
          
          # 恢复数据库
          if [ -f "/tmp/frps_panel.db.backup" ]; then
            echo "♻️  恢复数据库..."
            cp /tmp/frps_panel.db.backup $APP_DIR/backend/frps_panel.db
            rm /tmp/frps_panel.db.backup
          fi
          
          # 部署插件
          echo "🔌 部署插件..."
          cp frps-panel-linux-amd64 $APP_DIR/frps-panel
          chmod +x $APP_DIR/frps-panel
          cp *.toml $APP_DIR/ || true
          
          # 部署 FRP 二进制文件
          echo "🔍 检查 FRP 二进制文件..."
          if [ ! -d "$APP_DIR/frp" ]; then
            echo "⚠️  FRP 二进制文件不存在，请手动上传！"
            echo "📦 请将 frp_0.67.0_linux_amd64 目录上传到: $APP_DIR/frp"
            echo "   上传命令示例："
            echo "   scp -r frp_0.67.0_linux_amd64 root@your-server-ip:/opt/frps-panel/frp"
            mkdir -p $APP_DIR/frp
          else
            echo "✅ FRP 二进制文件已存在"
            chmod +x $APP_DIR/frp/frps || true
            chmod +x $APP_DIR/frp/frpc || true
          fi
          
          # 部署脚本文件
          echo "📜 部署脚本文件..."
          rm -rf $APP_DIR/scripts
          cp -r scripts $APP_DIR/
          chmod +x $APP_DIR/scripts/*.sh
          
          # 安装后端依赖
          echo "📦 安装后端依赖..."
          cd $APP_DIR/backend
          
          # 检查 uv 是否已安装
          if ! command -v uv &> /dev/null; then
            echo "🔧 安装 uv..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            # 创建系统级软链接
            ln -sf $HOME/.local/bin/uv /usr/local/bin/uv || true
          else
            echo "✅ uv 已安装"
          fi
          
          # 确保 PATH 包含 uv
          export PATH="$HOME/.local/bin:$PATH"
          
          # 使用 uv 创建虚拟环境并安装依赖（指定 Python 版本）
          uv venv .venv --python 3.12.12
          uv pip install -r requirements.txt
          
          # 初始化数据库（如果需要）
          if [ ! -f "$APP_DIR/backend/frps_panel.db" ]; then
            echo "🗄️  初始化数据库..."
            uv run python -m app.init_db
          fi
          
          # 运行数据库迁移
          echo "🔄 运行数据库迁移..."
          uv run alembic upgrade head || echo "⚠️  数据库迁移失败，可能已是最新版本"
          
          # 更新环境变量（添加新配置项）
          echo "⚙️  更新环境变量..."
          if ! grep -q "FRP_HTTP_PORT" .env; then
            echo "FRP_HTTP_PORT=8080" >> .env
          fi
          if ! grep -q "FRP_HTTPS_PORT" .env; then
            echo "FRP_HTTPS_PORT=8443" >> .env
          fi
          
          # 配置后端 systemd 服务
          echo "⚙️  配置后端服务..."
          tee /etc/systemd/system/frps-panel-backend.service > /dev/null << 'SERVICE_EOF'
          [Unit]
          Description=FRP SaaS Platform Backend
          After=network.target
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/frps-panel/backend
          Environment="PATH=/opt/frps-panel/backend/.venv/bin:/usr/local/bin:/usr/bin:/bin"
          ExecStart=/opt/frps-panel/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF
          
          # 配置 FRP 服务器 systemd 服务
          echo "⚙️  配置 FRP 服务器服务..."
          tee /etc/systemd/system/frps.service > /dev/null << 'FRPS_EOF'
          [Unit]
          Description=FRP Server
          After=network.target
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/frps-panel/frp
          ExecStart=/opt/frps-panel/frp/frps -c /opt/frps-panel/frp/frps.toml
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
          FRPS_EOF
          
          # 配置插件 systemd 服务
          echo "⚙️  配置插件服务..."
          tee /etc/systemd/system/frps-panel-plugin.service > /dev/null << 'PLUGIN_EOF'
          [Unit]
          Description=FRP Panel Plugin
          After=network.target frps.service frps-panel-backend.service
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/frps-panel
          ExecStart=/opt/frps-panel/frps-panel -c /opt/frps-panel/frps-panel.toml
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
          PLUGIN_EOF
          
          # 重载并启动服务
          echo "🚀 启动服务..."
          systemctl daemon-reload
          systemctl enable frps
          systemctl enable frps-panel-backend
          systemctl enable frps-panel-plugin
          systemctl start frps
          sleep 2
          systemctl start frps-panel-backend
          sleep 2
          systemctl start frps-panel-plugin
          
          # 检查服务状态
          echo "✅ 检查服务状态..."
          systemctl status frps --no-pager || true
          systemctl status frps-panel-backend --no-pager || true
          systemctl status frps-panel-plugin --no-pager || true
          
          # 配置 Nginx
          echo "🌐 配置 Nginx..."
          
          # 检查 Nginx 是否已安装
          if ! command -v nginx &> /dev/null; then
            echo "📦 安装 Nginx..."
            apt-get update
            apt-get install -y nginx
          else
            echo "✅ Nginx 已安装"
          fi
          
          # 创建 Nginx 配置
          tee /etc/nginx/sites-available/frps-panel > /dev/null << 'NGINX_EOF'
          server {
              listen 80;
              server_name _;
              
              # 前端静态文件
              location / {
                  root /opt/frps-panel/frontend;
                  try_files $uri $uri/ /index.html;
                  
                  # 缓存静态资源
                  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                      expires 1y;
                      add_header Cache-Control "public, immutable";
                  }
              }
              
              # 后端 API
              location /api/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  
                  # WebSocket 支持（为将来功能预留）
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
              
              # API 文档
              location /docs {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              
              location /openapi.json {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              
              # 安全头
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;
              
              # 日志
              access_log /var/log/nginx/frps-panel-access.log;
              error_log /var/log/nginx/frps-panel-error.log;
          }
          NGINX_EOF
          
          # 启用站点配置
          ln -sf /etc/nginx/sites-available/frps-panel /etc/nginx/sites-enabled/frps-panel
          
          # 删除默认站点配置（如果存在）
          rm -f /etc/nginx/sites-enabled/default
          
          # 测试 Nginx 配置
          echo "🔍 测试 Nginx 配置..."
          nginx -t
          
          # 启动 Nginx
          echo "🚀 启动 Nginx..."
          systemctl enable nginx
          systemctl restart nginx
          
          # 检查 Nginx 状态
          systemctl status nginx --no-pager || true
          
          echo ""
          echo "📝 部署信息："
          echo "   前端目录: /opt/frps-panel/frontend"
          echo "   后端 API: http://127.0.0.1:8000"
          echo "   Nginx 配置: /etc/nginx/sites-available/frps-panel"
          
          echo "🎉 部署完成！"
          echo "前端访问: http://$(curl -s ifconfig.me)"
          echo "后端 API: http://$(curl -s ifconfig.me)/api"
          echo "API 文档: http://$(curl -s ifconfig.me)/docs"
          EOF
          
          chmod +x deploy/deploy.sh

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*"
          target: "/tmp/frps-panel-deploy"
          strip_components: 1
          timeout: 300s
          command_timeout: 300s

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          timeout: 600s
          command_timeout: 600s
          script: |
            cd /tmp/frps-panel-deploy
            chmod +x deploy.sh
            ./deploy.sh
            
      - name: Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /tmp/frps-panel-deploy

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 部署成功！"
          else
            echo "❌ 部署失败！"
          fi
